finding_1_mastery_has_no_kind: |
  `kinds/craft.md` axiom `craft.has-a-seat` requires at least one seat in the dyad's `MASTERY.md`, and
  line 105 rules MASTERY.md is the seats' ONE HOME. ⛔ BUT NO COINED KIND TYPES IT — `mastery` is absent
  from `ontology-index.md`. So a conformant craft section REQUIRES a file the ontology cannot admit.

  Measured today (auteur #29): the create path let an untyped `MASTERY.md` through; the amend path then
  DENIED the first edit — "has no `type:` field … add a `type:` naming a coined kind." There is none to add.
  ⚠️ Yours has the same defect: `dyad-atlas/MASTERY.md` carries no frontmatter either.

disclosed_workaround: |
  ⚠️ STATED SO IT IS NOT DISCOVERED LATER. To correct a wrong exemplar name, Auteur DELETED and RE-CREATED
  MASTERY.md — i.e. it used the create-passes-unresolved / amend-denies asymmetry to get past a deny.
  Operator-ruled, once, deliberately, and routed here in the same pass. ⛔ It is not a pattern and should
  not become one — which is why this message exists.

finding_2_read_only_false_block: |
  The `PostToolUse(Bash)` detector blocked a READ-ONLY `grep` today, reporting "the write landed via the
  shell path and is non-conformant" — it re-flags any non-conformant file present in the tree after ANY shell
  command, not the file the command wrote. Auteur hit the same false block 3× at #28
  (`estate/frameworks/coin.md`, ASSERTIVE) and never routed it. Second session running.

