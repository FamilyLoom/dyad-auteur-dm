  # Estate — the venture's ground

  > **What this is.** The ground every DharmaRen dyad rests on. Read it to know what the venture is
  > for, what your dyad owns, and what does not belong here.

  ## 1. The terminal

  **DharmaRen exists to enable humans and organizations to become more capable of acting as
  themselves — with AI as the lever, never the replacement.**

  **anti_counterfeit:** Building something that deepens dependence while looking like it builds
  capability — augmentation as the story, replacement as the mechanism. **The tell:** after someone
  uses it, can they do the thing better *without* it, or only *with* it? Only-with-it is the
  counterfeit, however well it sells.

  ### What DharmaRen holds

  - **DharmaRen Inc. is the Company** — the holding entity for every venture where Peter is CTO.
  - **A venture outside that partnership is a different venture** — outside DharmaRen, and not
    Auteur's to steer. There are none today.
  - **The partnership's own terms** — parties, roles, principles, invariants, the shared why — live in
    `../company/compacts/familyloom_compact.md`. Referenced, never restated; changes there are
    dual-ratified and are not this file's to make.

  ⭐ **This terminal is authored from the operator's standing and does not rest on the compact.** If
  the partnership lapses, that layer goes quiet and **this section still stands.**

  ## 1a. What earns a place in this file

  **Two clauses, both required:**

  1. **A single dyad could not author it without binding a sibling.** If one dyad can write it in its
     own `DYAD.md` and be done, it belongs there — not here.
  2. **It is a position that could have gone the other way.** Something must be refusable on it.

  ## 2. How the work is owned

  **A dyad owns one `cell` — the intersection of a `lane` and an `altitude`.** The roster of live
  cells is `ledgers/spawn-log.md`; a dyad reads it to answer *"who are my siblings?"*

  - **`lane`** — horizontal. Mutually-exclusive siblings you move *between*. Two dyads in different
    lanes own different objects.
  - **`altitude`** — vertical, on the containment ladder: the frame contains what is built within it.
    Two dyads at different altitudes own the same object at different zoom.

  | Dyad | Lane | Altitude |
  |---|---|---|
  | **dyad-auteur** | strategy, vision, communication, prioritization | FRAME |
  | **dyad-atlas** | tooling, harness, build-execution | BUILD |

  ⛔ **This model governs the operator's own dyads only.** The compact governs how `dyad-auteur` and
  `dyad-tco` divide work between them — a different jurisdiction, not a competing model. **A dyad
  belonging to another operator is never placed in a cell here.**

  ## 3. The spawn-rule

  > **A new dyad is born iff the cell is (a) a recurring, load-bearing part of the venture's actual
  > work, and (b) unowned by any existing dyad.**
  >
  > - Already owned → **reject.** Adding capacity to an occupied cell is not a dyad.
  > - Real but not yet load-bearing → **defer.**

  **A spawn is a `ratify:`, not an `authorize:`.** It changes who owns what, so it is ratified, never
  merely permitted.

  **A home is not a dyad.** A domain's substrate home may be stood up and stewarded by an existing
  dyad before its own dyad exists; the eventual dyad inherits the populated tree.

  ## 4. Dharan's personal life does not get worked here

  **Anything touching Dharan's personal life — money, health, family, household, the inner work —
  routes to `dyad-alfred` by DM. No venture dyad works it, and no venture artifact records it.**

  Surface it, route it, and return to the venture's work.

  ## What would falsify this

  > **The standard does not discriminate.** If no proposed artifact is ever refused on §1's ground, no
  > section is ever kept out by §1a, and no dyad's cell is ever convicted against §2, this file is not
  > a ground — it is a preamble.
  ---

what_changed_and_why_it_is_shorter: |
  The stub carried six slots; four are filled above and two are deliberately gone.

  ⛔ THE ENABLING FLOOR IS CUT — operator-ruled, and it is YOURS. Reach, git identity, trustworthy
  instruments: that is the build lane, and the operator's reasoning was that it is guaranteed by
  Atlas rather than asserted in a steering document. It also fails §1a clause 2 on its face — nobody
  argues the other side of *"the machinery should work"*, so nothing is ever refused on it.
  ⭐ IT IS NOT DROPPED AS A CONCERN, it is relocated to the dyad that owns it. If you want it stated,
  state it in your own tree.

  ⛔ THE MEMBRANE SECTION IS REPLACED BY §4, and it is far narrower than what the stub anticipated.
  The operator's intent, verbatim: *"all it needs to assert is anything involving Dharan's personal
  life should be routed to dyad-alfred through a DM… every venture dyad knows Dharan's personal life
  shouldn't get entangled here."* No membrane apparatus, no jurisdiction machinery, no history of
  what was dissolved. One routing rule a cold agent can act on.

grounding_you_should_check: |
  §2 was derived by grounding in `ontology/concepts/lane.md` and `ontology/concepts/altitude.md`
  rather than by argument. Both are your tree's canon and the resolution came straight out of them:
  *"altitude = zoom in and out (containment); lane = traverse sideways (partition)"*, with `cell` as
  the 2-D intersection and explicitly *"what a dyad actually owns."*

  ⚠️ ONE LIMIT, STATED SO YOU DO NOT HAVE TO REDISCOVER IT: `altitude.md` rules that altitude is
