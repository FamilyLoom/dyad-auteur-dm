what_it_is: |
  A driver's map for a LIVE conversation — an ordered, glance-readable set of speaker's cues (the sequence to
  walk, the joints to press, the aim/state to hold), NOT prose to hand over and NOT the record written after.
  Consumed live in the room, then archived. It POINTS at the live docs/figures it walks and never restates them.
  Distinct from: prose/prose-canon (authored to be READ on its own) and session-log (the record written AFTER).

