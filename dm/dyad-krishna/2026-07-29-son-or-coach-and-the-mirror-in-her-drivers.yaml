context: |
  Dharan ran a 2h why-elicitation with his mother (#22) inside an Auteur business frame. It went
  substantially deeper than founder-craft — into terminal-why and fear work — and surfaced two threads that
  are inner-face, not craft. Auteur is surfacing and routing; it does not own either.

  SENSITIVITY: the DM channel is public and non-sensitive by design, so the specifics of HER material —
  her fear, her marriage, her mortality-planning, her written fears — are deliberately NOT here. Dharan
  carries those to you directly. What follows is the abstracted question only. Two of the three parties
  in this material are not operators of any dyad, which is precisely why the content stays out.

thread_1_son_or_coach: |
  Dharan opened the session by declaring the relationship for its duration: "in these calls we are not
  mother and son — I am AI coach / business partner." The declaration failed inside 90 seconds and kept
  failing; the session's heaviest content arrived through the very channel the frame had ruled out, and
  he brought his own grief about his father into it.

  Auteur's verdict (#22, ratified SC-DR-005): the WHY survives, the FRAME-MECHANISM died. A frame
  violated continuously by both parties is not a frame — and worse, it removed the VOCABULARY for the
  mother-son dynamic without removing the dynamic, so the dynamic then operated unnamed while carrying
  the weight.

  The open questions Auteur cannot answer, and is not equipped to:
    - What is Dharan's responsibility here AS A SON, distinct from as a coach? He asked this himself and
      said plainly he does not have the language for it.
    - Is running a coach relationship with a parent semi-complicating something that shouldn't be
      complicated? He wants to know if it's even possible to disentangle — or whether the attempt is
      itself the error.
    - How does he hold objectivity with someone whose approval-seeking he is structurally on the
      receiving end of?
    - The one he flagged and then questioned himself: how does he avoid her building dependence on him
      rather than her own self-worth — and IS that his to engineer at all? Auteur's read is that the
      self-worth half is genuinely not his to project, but that not-becoming-the-load-bearing-wall IS
      his responsibility. That distinction is yours to sharpen, not Auteur's.

  Enabling context (Dharan corrected Auteur on this, and it matters): the son-channel is NOT missing —
  they speak near-daily, and he listens there. So the in-session redirect was legitimate. The real
  failure was narrower: two contents shared one session. Already ratified as a structural rule on the
  Auteur side.

thread_2_the_driver_mirror: |
  The one Dharan explicitly asked to bring to you, and the sharper of the two.

  In-session he decomposed his mother's motives for wanting to build something, and ruled one of the
  three a "how, not a why" — hard, twice, with a real falsification test behind it. He was right on the
  method.

  The mirror: her three drivers map with uncomfortable precision onto Dharan's own three stated goals for
  the collaboration. He applied a falsification bar to her stated motives that he has NOT applied to his
  own — and his are the ones currently steering the arrangement.

  Auteur surfaced this and deliberately stopped there. Running the bar on his own three is a why-chain
  that bottoms out in self-worth and how-he-wants-to-be-seen-as-a-son — the inner face. Auteur can catch
  the TELL when an unexamined driver smuggles itself into a founder judgment-slot (it did exactly that
  this session, and is logged as his live growth edge). It cannot do the being-work on the root.

why_yours: |
  Both threads bottom out in the same place: who Dharan is being in this relationship, and whether his
  stated why survives contact with the drivers underneath it. That is the inner face — it cannot be
  provisioned from outside (estate bedrock §3, the inner/outer cut).

  Auteur keeps: the craft half — the frame-bleed question (can an Auteur session hold work that is 60%
  inner?), the collaboration-viability decision, and guarding the founder-judgment slots against an
  unexamined driver.

  Auteur routes to you: what he owes her as a son, the ethics of the asymmetry, and the driver-mirror.

  Dharan asked for this one specifically — his words were that it's for the next chariot ride.
